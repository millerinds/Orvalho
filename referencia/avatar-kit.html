<title>Kit do Avatar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: céu vivo fixo ao fundo (Aero) → nav em vidro → herói acrílico com a esfera d'água como peça única → bento → faixa de categorias. Tema claro, deliberadamente único nesta maquete. */
:root{
  color-scheme: light;
  --sky-deep:#0a5fb4; --sky:#2f9be8; --sky-mid:#7cc8f5; --sky-pale:#d6f0ff;
  --aqua:#16bcc4; --aqua-deep:#0b8a95;
  --leaf:#71c935; --leaf-deep:#3b8f17; --leaf-pale:#e6f8d4;
  --ink:#0c2c4a; --ink-soft:#3c5d7a; --ice:#f6fbff; --white:#ffffff;
  --coral:#ff8a5b; --warn:#f2a516; --bad:#e2506a;
  --f-display:"Nunito", "Varela Round", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  --r-card:24px; --edge:#0b3a6e; --edge-leaf:#2b6b0d; --edge-aqua:#06606a;
}
*{box-sizing:border-box}
html{background:var(--sky-mid)}
body{
  margin:0; min-height:100vh; font-family:var(--f-body); font-size:16px; line-height:1.55; color:var(--ink);
  background:linear-gradient(180deg,#0b62bd 0%,#2a93e4 26%,#7cc8f5 52%,#d4efff 74%,#eefaff 100%);
  background-attachment:fixed; overflow-x:hidden;
}
/* ---------- cena ---------- */
.scene{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.scene svg{position:absolute; inset:0; width:100%; height:100%}
.sun{position:absolute; left:-12vw; top:-18vw; width:60vw; height:60vw; border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.75) 0%,rgba(255,255,255,.25) 30%,rgba(255,255,255,0) 62%)}
.bokeh{position:absolute; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,.25) 40%,rgba(180,230,255,.12) 70%,rgba(255,255,255,0) 72%);
  border:1px solid rgba(255,255,255,.35); animation:float 14s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-22px)}}

/* ---------- moldura ---------- */
.wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto;
  padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px));
  padding-block:66px 120px}

/* ---------- vidro líquido ---------- */
.glass{
  position:relative; isolation:isolate;
  background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.18));
  -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%);
  border:3px solid rgba(11,58,110,.75);
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.9), inset -1px -1px 0 rgba(255,255,255,.25), 6px 6px 0 rgba(11,58,110,.4);
}
.glass::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:-1;
  background:radial-gradient(120% 80% at 12% 0%,rgba(255,255,255,.7),rgba(255,255,255,0) 45%)}

/* ---------- nav ---------- */
.nav{display:flex; align-items:center; gap:8px; margin-left:66px; padding:8px 8px 8px 96px; border-radius:999px;
  position:sticky; top:calc(env(safe-area-inset-top,0px) + 58px); z-index:20}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:900; font-size:1.3rem; color:var(--sky-deep); text-decoration:none; margin-right:auto}
.brand .drop{width:26px; height:30px}
.links{display:flex; gap:4px}
.links a{display:flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; text-decoration:none; color:var(--ink); font-weight:600; font-size:.95rem}
.links a:hover{background:rgba(255,255,255,.45)}
.links a[aria-current="page"]{background:linear-gradient(180deg,#fff,#e4f4ff); color:var(--sky-deep);
  border:2.5px solid var(--edge); padding:7px 14px; box-shadow:inset 0 1px 0 #fff, 3px 3px 0 var(--edge)}
.icon-btn{width:40px; height:40px; display:grid; place-items:center; border-radius:50%; border:0; background:transparent; color:var(--ink); cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.5)}
svg.i{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}


/* ---------- avatar de perfil (moldura acrílica com formatos) ---------- */
/* camadas recortadas pelo mesmo clipPath (objectBoundingBox): contorno escuro → moldura gloss → borda da janela → janela */
.avatar{position:absolute; left:-72px; top:-36px; width:144px; height:144px; z-index:2;
  filter:drop-shadow(4px 4px 0 var(--edge)) drop-shadow(0 12px 16px rgba(8,60,130,.3));
  transition:transform .15s ease, filter .15s ease}
/* .av-open: o boneco e a caixinha dele (abre o provador); .av-pen: só troca o formato da janela */
.av-open{position:absolute; inset:0; border:0; padding:0; background:none; cursor:pointer}
.av-open:focus-visible{outline:none}
.av-open:focus-visible .av-edge{background:#19c2c9}
/* .av-body: caixa onde a forma é desenhada. No triângulo ela cresce para o boneco caber sem mudar de lugar. */
.av-body{position:absolute; inset:0}
.av-layer{position:absolute; clip-path:var(--clip-out)}
.av-edge{inset:0; background:var(--edge)}
.av-frame{inset:3px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.35) 38%,rgba(255,255,255,0) 52%),
    linear-gradient(160deg,#bff1ff 0%,#4fc3ea 40%,#1690d6 75%,#0e6bb8 100%)}
.av-win-edge{inset:13px; background:var(--edge); clip-path:var(--clip-in)}
.av-win{inset:15px; clip-path:var(--clip-in); overflow:hidden;
  /* estúdio cinza do mini-mundo 3D */
  background:radial-gradient(85% 70% at 50% 36%,#ffffff 0%,#eef0f1 38%,#d3d7da 72%,#b7bcc0 100%)}
.av-win canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
[data-shape="triangulo"] .av-win canvas{transform:translateX(7%)}
[data-shape="feijao"] .av-win canvas{transform:translateX(12%)}
[data-shape="feijao"] .av-win-edge{clip-path:url(#c-feijao-e)}
[data-shape="feijao"] .av-win{clip-path:url(#c-feijao-in)}
.av-win img{position:absolute; inset:6%; width:88%; height:88%; object-fit:contain; mix-blend-mode:multiply}
.av-win::before{ /* profundidade: a caixinha */
  content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(180deg,rgba(20,32,48,.32) 0%,rgba(20,32,48,0) 20%), linear-gradient(90deg,rgba(20,32,48,.14),rgba(20,32,48,0) 12%)}
.av-win::after{ /* reflexo do vidro */
  content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:linear-gradient(125deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.12) 34%,rgba(255,255,255,0) 35%)}
/* triângulo: caixa de 176px com o incentro no centro do avatar; o boneco fica exatamente onde está nos outros formatos */
[data-shape="triangulo"] .av-win img{inset:4% 0 8% 10%; width:90%; height:88%}
.av-pen{position:absolute; right:0; bottom:2px; z-index:3; width:30px; height:30px; padding:0; cursor:pointer; border-radius:50%; display:grid; place-items:center; color:#fff;
  border:2.5px solid var(--edge); background:radial-gradient(circle at 35% 28%,#bfe8ff,#2f9be8 45%,#0a5fb4); box-shadow:inset 0 2px 3px rgba(255,255,255,.8)}
.av-pen svg.i{width:15px; height:15px; stroke-width:2.4}
.av-pen:hover{transform:scale(1.1)}
.av-pen:focus-visible{outline:3px solid #19c2c9; outline-offset:2px}

/* formatos: --clip-out (moldura) e --clip-in (janela) */
.avatar, .shape-opt, .shape-thumb{--clip-out:url(#c-quadrado); --clip-in:url(#c-quadrado-in)}
[data-shape="circulo"]{--clip-out:url(#c-circulo); --clip-in:url(#c-circulo)}
[data-shape="d"]{--clip-out:url(#c-d); --clip-in:url(#c-d)}
[data-shape="triangulo"]{--clip-out:url(#c-triangulo); --clip-in:url(#c-triangulo)}
[data-shape="feijao"]{--clip-out:url(#c-feijao); --clip-in:url(#c-feijao)}
[data-shape="pedra"]{--clip-out:url(#c-pedra); --clip-in:url(#c-pedra)}

/* seletor de formato da janela (lápis) */
.shape-pop{position:absolute; left:-72px; top:calc(100% + 60px); background:rgba(250,253,255,.98); z-index:40; width:min(330px,calc(100vw - 32px)); border-radius:22px; padding:16px}
.shape-pop h2{font:800 1rem/1.2 var(--f-display); margin:0 0 4px}
.shape-pop p{margin:0 0 12px; font-size:.86rem; color:var(--ink-soft)}
.shape-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
/* opções do provador */
.color-opt{aspect-ratio:1; width:100%; border-radius:50%; cursor:pointer; padding:0;
  border:2px solid var(--c2);
  background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.95) 0 14%,rgba(255,255,255,0) 30%), radial-gradient(circle at 50% 85%,var(--c3),var(--c1) 55%,var(--c2) 100%);
  transition:transform .12s}
.color-opt:hover{transform:scale(1.08)}
.color-opt[aria-checked="true"]{outline:3px solid var(--edge); outline-offset:2px}
.shape-opt{display:grid; justify-items:center; gap:6px; padding:10px 4px 8px; border-radius:14px; border:2px solid transparent; background:rgba(255,255,255,.55);
  font:600 .78rem var(--f-body); color:var(--ink); cursor:pointer}
.shape-opt:hover{background:rgba(255,255,255,.85)}
.shape-opt[aria-checked="true"]{border-color:var(--edge); background:#fff; box-shadow:3px 3px 0 var(--edge)}
.shape-opt i{display:block; width:46px; height:46px; clip-path:var(--clip-out);
  background:linear-gradient(180deg,rgba(255,255,255,.9) 0 30%,rgba(255,255,255,0) 50%), linear-gradient(160deg,#9fe6ff,#1690d6 70%,#0b3a6e)}

/* ---------- provador (guarda-roupa do boneco) ---------- */
/* janela no estilo "player" com abinha: o palco do boneco fica por cima da moldura, saindo pela esquerda e por cima */
.prov-back{position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:28px 24px 24px;
  background:radial-gradient(120% 90% at 50% 30%,rgba(120,200,255,.28),rgba(6,40,90,.5));
  -webkit-backdrop-filter:blur(8px) saturate(140%); backdrop-filter:blur(8px) saturate(140%);
  animation:prov-fade .22s ease-out}
.prov-back[hidden]{display:none}
@keyframes prov-fade{from{opacity:0}}
@keyframes prov-pop{from{opacity:0; transform:translateY(18px) scale(.96)}}
.prov{position:relative; width:min(940px,100%); height:min(600px,calc(100vh - 52px)); animation:prov-pop .32s cubic-bezier(.2,.9,.3,1.15);
  --c1:#1f4fe0; --c2:#0a1d78; --c3:#38d6ff}

/* moldura prateada-azulada, borda grossa + sombra dura */
.prov-frame{position:absolute; left:64px; top:28px; right:0; bottom:0; border-radius:34px;
  border:4px solid var(--edge);
  background:
    linear-gradient(180deg,rgba(255,255,255,.95) 0,rgba(255,255,255,.4) 22px,rgba(255,255,255,0) 60px),
    linear-gradient(180deg,#eef5fc 0%,#d3e3f2 48%,#bfd4e8 52%,#d4e3f1 100%);
  box-shadow:inset 0 2px 0 #fff, inset 0 -3px 0 rgba(11,58,110,.12), 7px 7px 0 var(--edge), 0 30px 60px rgba(4,30,70,.35)}
/* abinha do topo, emendada na moldura */
.prov-tab{position:absolute; top:-30px; left:296px; right:18px; display:flex; justify-content:center; pointer-events:none}
.prov-tab{gap:6px; align-items:flex-end}
.prov-tab button{pointer-events:auto; display:flex; align-items:center; gap:8px; padding:7px 20px 6px; position:relative; cursor:pointer;
  border:4px solid var(--edge); border-radius:20px 20px 0 0; font:900 1rem/1 var(--f-display); letter-spacing:.01em}
.prov-tab button[aria-selected="true"]{z-index:2; margin-bottom:-4px; border-bottom:0; color:var(--edge); background:linear-gradient(180deg,#ffffff 0%,#f3f8fd 100%)}
.prov-tab button[aria-selected="false"]{z-index:1; padding:6px 16px 5px; border-bottom:0; margin-bottom:-4px; color:var(--ink-soft);
  background:linear-gradient(180deg,#e2edf7,#c9dbec); box-shadow:inset 0 -6px 8px -6px rgba(11,58,110,.35)}
.prov-tab button[aria-selected="false"]:hover{color:var(--edge); background:linear-gradient(180deg,#eef5fb,#d5e4f1)}
.prov-tab button:focus-visible{outline:3px solid #19c2c9; outline-offset:2px}
.prov-tab button[aria-selected="true"]::before,.prov-tab button[aria-selected="true"]::after{ /* curvinhas onde a aba encontra a moldura */
  content:""; position:absolute; bottom:0; width:18px; height:18px; background:transparent}
.prov-tab button[aria-selected="true"]::before{left:-22px; border-bottom-right-radius:14px; box-shadow:6px 6px 0 #f3f8fd; border:4px solid var(--edge); border-top:0; border-left:0}
.prov-tab button[aria-selected="true"]::after{right:-22px; border-bottom-left-radius:14px; box-shadow:-6px 6px 0 #f3f8fd; border:4px solid var(--edge); border-top:0; border-right:0}
.prov-tab svg.i{width:18px; height:18px; stroke-width:2.2}

.prov-x{position:absolute; top:7px; right:14px; z-index:3; width:34px; height:34px}

/* botões redondos de vidro (fechar, aleatório, girar, acenar) */
.gbtn{width:38px; height:38px; display:grid; place-items:center; border-radius:50%; cursor:pointer; color:var(--edge); padding:0;
  border:3px solid var(--edge);
  background:radial-gradient(circle at 50% 18%,#fff 0 22%,rgba(255,255,255,0) 52%), linear-gradient(180deg,#f4f9ff,#c2d8ee);
  box-shadow:inset 0 -3px 5px rgba(11,58,110,.18), 2px 2px 0 var(--edge); transition:transform .12s, box-shadow .12s}
.gbtn:hover{transform:translate(-1px,-1px); box-shadow:inset 0 -3px 5px rgba(11,58,110,.18), 3px 3px 0 var(--edge)}
.gbtn:active{transform:translate(2px,2px); box-shadow:inset 0 -3px 5px rgba(11,58,110,.18), 0 0 0 var(--edge)}
.gbtn svg.i{width:18px; height:18px; stroke-width:2.3}
.gbtn.big{width:50px; height:50px; color:#fff;
  background:radial-gradient(circle at 50% 16%,rgba(255,255,255,.95) 0 20%,rgba(255,255,255,0) 50%), radial-gradient(circle at 50% 90%,#7fe0ff,#1a86e6 55%,#0b4f9e)}
.gbtn.big svg.i{width:22px; height:22px}

/* palco do boneco: a abinha que sobrepõe a moldura */
.prov-stage{position:absolute; left:0; top:0; width:340px; bottom:92px; z-index:2; border-radius:30px; padding:13px;
  border:4px solid var(--edge);
  background:
    linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.35) 18%,rgba(255,255,255,0) 30%),
    linear-gradient(160deg,#bff1ff 0%,#4fc3ea 40%,#1690d6 75%,#0e6bb8 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8), 7px 7px 0 var(--edge), 0 20px 40px rgba(4,30,70,.3)}
.prov-win{position:relative; height:100%; border-radius:20px; overflow:hidden; border:3px solid var(--edge);
  background:radial-gradient(80% 60% at 50% 34%,#ffffff 0%,#eef0f1 40%,#d3d7da 75%,#b7bcc0 100%);
  box-shadow:inset 0 10px 18px rgba(20,32,48,.22); touch-action:none; cursor:grab}
.prov-win:active{cursor:grabbing}
.prov-win canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.prov-win::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(125deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.08) 30%,rgba(255,255,255,0) 31%)}
.prov-hint{position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:1; white-space:nowrap; pointer-events:none;
  font:600 .74rem/1 var(--f-mono,monospace); color:#5d6b78; background:rgba(255,255,255,.75); padding:6px 10px; border-radius:999px}

/* tela branca à direita: opções + trilho de categorias */
.prov-screen{position:absolute; z-index:1; left:296px; right:18px; top:48px; bottom:84px;
  display:grid; grid-template-columns:1fr 118px; overflow:hidden; overflow:clip;
  border:3px solid var(--edge); border-radius:20px;
  background:linear-gradient(180deg,#ffffff 0%,#f4f9fe 100%);
  box-shadow:inset 0 3px 8px rgba(11,58,110,.12)}
.prov-pane{padding:20px 22px; overflow:auto; scrollbar-width:thin}
.prov-pane h2{font:900 1.45rem/1.1 var(--f-display); margin:0 0 4px; color:var(--ink); letter-spacing:-.01em}
.prov-pane p.sub{margin:0 0 16px; font-size:.9rem; color:var(--ink-soft)}
.prov-rail[hidden]{display:none !important}
.prov-rail{display:flex; flex-direction:column; gap:6px; padding:12px 10px; border-left:3px solid var(--edge);
  background:linear-gradient(90deg,#e4eff9,#f2f7fc)}
.cat{display:grid; justify-items:center; gap:5px; padding:10px 4px 8px; border-radius:16px; cursor:pointer;
  border:2.5px solid transparent; background:transparent; color:var(--ink); font:700 .78rem/1.1 var(--f-body)}
.cat svg.i{width:26px; height:26px; stroke-width:1.9; color:var(--sky-deep,#0a5fb4)}
.cat:hover{background:rgba(255,255,255,.8)}
.cat[aria-selected="true"]{background:#fff; border-color:var(--edge); box-shadow:3px 3px 0 var(--edge)}
.cat[aria-disabled="true"]{opacity:.5; cursor:not-allowed}
.cat small{font:600 .62rem/1 var(--f-mono,monospace); color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em}

/* grades de opções */
.opt-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:12px}
.opt{display:grid; justify-items:center; gap:6px; padding:12px 6px 10px; border-radius:18px; cursor:pointer;
  border:2.5px solid #cfe0ef; background:linear-gradient(180deg,#fff,#f1f7fd); color:var(--ink); font:700 .82rem/1.1 var(--f-body);
  transition:transform .12s, box-shadow .12s, border-color .12s}
.opt:hover{transform:translateY(-2px); border-color:#8fb7da}
.opt[aria-checked="true"]{border-color:var(--edge); background:#fff; box-shadow:3px 3px 0 var(--edge)}
.opt svg.thumb{width:64px; height:64px; overflow:visible}
.opt .shape-thumb{width:58px; height:58px; clip-path:var(--clip-out); display:block;
  background:linear-gradient(180deg,rgba(255,255,255,.9) 0 30%,rgba(255,255,255,0) 50%), linear-gradient(160deg,#9fe6ff,#1690d6 70%,#0b3a6e)}
.prov .color-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:12px; max-width:420px}
.prov .color-opt{border-width:3px}
.ui-sec + .ui-sec{margin-top:22px}
.ui-sec h3{font:800 1rem/1.2 var(--f-display); margin:0 0 10px; color:var(--ink)}
.tag{display:inline-block; margin-left:6px; padding:3px 8px; border-radius:999px; vertical-align:1px;
  font:700 .62rem/1 var(--f-mono,monospace); text-transform:uppercase; letter-spacing:.06em; color:#7a4a00; background:#ffe3a3; border:1.5px solid #d99a20}
.bg-thumb{display:block; width:76px; height:52px; border-radius:12px; border:2.5px solid var(--edge); box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.opt svg.cur-thumb{width:44px; height:44px; margin:4px 0}
.acc-sec{margin-top:22px}
.switch-row{position:relative; display:flex; align-items:center; gap:12px; margin-top:20px; padding:12px 14px; border-radius:16px; cursor:pointer;
  border:2.5px solid #cfe0ef; background:linear-gradient(180deg,#fff,#f1f7fd)}
.switch-row strong{display:block; font:800 .95rem/1.2 var(--f-display)}
.switch-row small{display:block; font-size:.8rem; color:var(--ink-soft)}
.switch-row input{position:absolute; left:14px; top:50%; opacity:0; width:1px; height:1px; margin:0}
.switch-row .sw{flex:none; position:relative; width:50px; height:28px; border-radius:999px; border:2.5px solid var(--edge);
  background:linear-gradient(180deg,#b8cde2,#e6eff7); box-shadow:inset 0 2px 4px rgba(11,58,110,.3); transition:background .2s}
.switch-row .sw::after{content:""; position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; border:2px solid var(--edge);
  background:radial-gradient(circle at 40% 30%,#fff,#dbe8f4); transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.switch-row input:checked + .sw{background:radial-gradient(60% 50% at 50% 20%,rgba(255,255,255,.8),rgba(255,255,255,0)), linear-gradient(180deg,#a6e86a,#4ea81c); border-color:var(--edge-leaf)}
.switch-row input:checked + .sw::after{transform:translateX(22px); border-color:var(--edge-leaf)}
.switch-row input:focus-visible + .sw{outline:3px solid #19c2c9; outline-offset:2px}
.pane-sub{font:800 1rem/1.2 var(--f-display); margin:0 0 10px}
.acc-sec h3{font:800 1rem/1.2 var(--f-display); margin:0 0 10px}
.opt svg.thumb.acc{overflow:hidden}
.soon{display:grid; place-items:center; gap:8px; text-align:center; padding:30px 10px; border:2.5px dashed #a9c6e0; border-radius:18px; color:var(--ink-soft)}
.soon svg.i{width:34px; height:34px; color:#8fb7da}

/* barra de baixo: controles redondos, trilho de girar, salvar */

.spin{flex:1; display:flex; align-items:center; gap:10px; min-width:120px; font:600 .72rem/1 var(--f-mono,monospace); color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em}
.spin input{flex:1; -webkit-appearance:none; appearance:none; height:22px; background:transparent; cursor:pointer}
.spin input::-webkit-slider-runnable-track{height:12px; border-radius:999px; border:2.5px solid var(--edge);
  background:linear-gradient(180deg,#b8cde2,#f5f9fd 60%,#dde9f4); box-shadow:inset 0 2px 3px rgba(11,58,110,.25)}
.spin input::-moz-range-track{height:8px; border-radius:999px; border:2.5px solid var(--edge);
  background:linear-gradient(180deg,#b8cde2,#f5f9fd 60%,#dde9f4)}
.spin input::-webkit-slider-thumb{-webkit-appearance:none; width:34px; height:20px; margin-top:-6px; border-radius:999px; border:2.5px solid var(--edge-leaf);

@media (max-width:760px){

/* ---------- botões-gota ---------- */
.btn{position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:10px; border:0; cursor:pointer;
  font:700 1rem/1 var(--f-body); color:#fff; text-decoration:none; padding:14px 24px; border-radius:999px;
  background:linear-gradient(180deg,#4fb6ff 0%,#1a86e6 48%,#0c64c2 52%,#1a7fd8 100%);
  --e:var(--edge); border:3px solid var(--e);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 6px rgba(0,40,100,.35), 4px 4px 0 var(--e);
  transition:transform .12s, box-shadow .12s}
.btn::before{content:""; position:absolute; left:8%; right:8%; top:2px; height:46%; border-radius:999px 999px 40% 40%/999px 999px 100% 100%;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.12))}
.btn > *{position:relative}
.btn:hover{transform:translate(-1px,-1px); box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 6px rgba(0,40,100,.35), 5px 5px 0 var(--e)}
.btn:active{transform:translate(3px,3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 1px 1px 0 var(--e)}
.btn.leaf{background:linear-gradient(180deg,#a6e86a 0%,#62bd2a 48%,#3f9a14 52%,#5bb526 100%);
  --e:var(--edge-leaf)}
.btn.sm{padding:8px 15px; font-size:.9rem}
.btn.sm{box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 3px 3px 0 var(--e)}

.hello p{margin:0; font-size:1.15rem; color:rgba(255,255,255,.92)}
.hello b{font-weight:700; color:#fff}

/* ---------- card de borda grossa (assinatura) ---------- */
/* contorno sólido grosso + sombra dura deslocada (herança do Quiz Toon), com gloss Aero por dentro */
.acrylic{
  --e:var(--edge); --tint:rgba(214,240,255,.65);
  position:relative; border-radius:var(--r-card); border:4px solid var(--e);
  background:linear-gradient(180deg,#ffffff 0%,var(--ice) 55%,var(--tint) 100%);

  transition:transform .15s ease, box-shadow .15s ease;
}
.acrylic::after{ /* gloss em arco */

.acrylic > *{position:relative; z-index:1}
a.acrylic, .acrylic.lift{cursor:pointer}

/* ---------- bento ---------- */
.bento{display:grid; grid-template-columns:1.6fr 1fr; gap:24px}
.side{display:grid; gap:24px; align-content:start}

/* herói */
.hero{display:grid; grid-template-columns:1fr auto; align-items:center; gap:28px; padding:34px 34px 30px; min-width:0}
.kicker{display:flex; align-items:center; gap:8px; font-weight:600; color:var(--sky-deep); font-size:.95rem; margin:0 0 10px}
.kicker .dot{width:9px; height:9px; border-radius:50%; background:var(--aqua); box-shadow:0 0 0 4px rgba(22,188,196,.2)}
.hero h2{font:900 clamp(2rem,3.6vw,2.9rem)/1.04 var(--f-display); margin:0 0 12px; letter-spacing:-.015em; text-wrap:balance}
.hero p.lede{margin:0 0 22px; color:var(--ink-soft); max-width:38ch; font-size:1.05rem}
.facts{display:flex; flex-wrap:wrap; gap:8px 18px; margin:0 0 26px; padding:0; list-style:none; color:var(--ink-soft); font-size:.92rem}
.facts li{display:flex; align-items:center; gap:7px}
.facts svg.i{width:17px; height:17px; color:var(--aqua-deep)}
.actions{display:flex; flex-wrap:wrap; gap:12px}

/* esfera d'água */
.orb-stage{position:relative; width:220px; aspect-ratio:1; max-width:100%; align-self:center}
.rings{position:absolute; inset:-26px; width:calc(100% + 52px); height:calc(100% + 52px)}
.orb{position:absolute; inset:0; border-radius:50%; overflow:hidden;
  background:radial-gradient(circle at 50% 120%,rgba(120,210,255,.45),rgba(235,248,255,.35) 60%,rgba(255,255,255,.55));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.95), inset 0 -18px 34px rgba(10,95,180,.28), inset 0 10px 30px rgba(255,255,255,.8), 0 0 0 1px rgba(10,95,180,.35), 0 26px 40px -18px rgba(10,95,180,.55)}
.water{position:absolute; left:0; right:0; bottom:0; height:var(--fill,66%);
  background:linear-gradient(180deg,#3fd2d4 0%,#1d9fe6 55%,#0b63bf 100%)}
.wave{position:absolute; left:0; bottom:calc(100% - 9px); width:200%; height:22px; animation:wave 5s linear infinite}
.wave.back{opacity:.5; animation-duration:8s; bottom:calc(100% - 6px)}
@keyframes wave{to{transform:translateX(-50%)}}
.orb-shine{position:absolute; left:16%; top:8%; width:52%; height:30%; border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0)); transform:rotate(-18deg)}
.orb-spark{position:absolute; right:22%; bottom:18%; width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,.9); filter:blur(.5px)}
.orb-read{position:absolute; inset:0; display:grid; place-content:center; text-align:center; color:#fff}
.orb-read strong{font:700 2.6rem/1 var(--f-num); letter-spacing:-.03em}
.orb-read span{font-size:.85rem; font-weight:600; opacity:.95}

/* jogar rápido */
.quick{padding:26px 26px 24px}
.card-h{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.card-h h3{font:800 1.45rem/1.15 var(--f-display); margin:0}
.badge-orb{flex:none; width:44px; height:44px; border-radius:50%; border:2.5px solid var(--edge-leaf); display:grid; place-items:center; color:#fff;
  background:radial-gradient(circle at 35% 28%,#c8f58f,#6cc832 45%,#2f7d10);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.8), inset 0 -3px 6px rgba(20,70,0,.4), 0 0 0 1px rgba(40,100,10,.5), 0 6px 12px -6px rgba(40,100,10,.8)}
.badge-orb.sky{border-color:var(--edge); background:radial-gradient(circle at 35% 28%,#bfe8ff,#2f9be8 45%,#0a5fb4); box-shadow:inset 0 2px 3px rgba(255,255,255,.8), inset 0 -3px 6px rgba(0,40,100,.4), 0 0 0 1px rgba(6,60,130,.5), 0 6px 12px -6px rgba(6,60,130,.8)}
.badge-orb.aqua{border-color:var(--edge-aqua); background:radial-gradient(circle at 35% 28%,#c7fbf8,#16bcc4 45%,#0b6f78); box-shadow:inset 0 2px 3px rgba(255,255,255,.8), inset 0 -3px 6px rgba(0,60,70,.4), 0 0 0 1px rgba(0,90,100,.5), 0 6px 12px -6px rgba(0,90,100,.8)}
.badge-orb svg.i{width:20px; height:20px; stroke-width:2.2}

/* resultados */
.results{border-radius:26px; padding:22px 22px 12px}
.results h3{font:800 1.15rem/1.2 var(--f-display); margin:0}
.results .card-h{align-items:center; margin-bottom:6px}

.res{list-style:none; margin:0; padding:0}

.res .t{font-weight:600}
.res .d{grid-column:1; font-size:.84rem; color:var(--ink-soft)}
.score{border:2px solid var(--edge); grid-row:1 / span 2; grid-column:2; font:700 .95rem/1 var(--f-num); padding:8px 12px; border-radius:999px; color:#fff; font-variant-numeric:tabular-nums}
.score.ok{background:linear-gradient(180deg,#8fdc4f,#4aa61c); box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 0 0 1px rgba(40,100,10,.4)}
.score.no{background:linear-gradient(180deg,#f27b8f,#c93a55); box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 0 0 1px rgba(130,20,40,.4)}

.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin:56px 6px 18px}
.sec-h h2{font:900 1.9rem/1.1 var(--f-display); margin:0; color:var(--ink)}

.tube{border:2px solid var(--edge); height:16px; border-radius:999px; background:rgba(255,255,255,.55); box-shadow:inset 0 1px 3px rgba(10,60,120,.25), 0 0 0 1px rgba(255,255,255,.8); overflow:hidden}

<script>
/* Avatar: boneco 3D (cabeça flutuando, corpo de jujuba, braços soltos) + provador para personalizar.
   Mesma fábrica Doll() desenha o boneco pequeno do avatar e o grande do provador. */
(function(){
  /* ---------- dados ---------- */
  var PRESETS = { // base, borda, luz interna
    azul:['#1f4fe0','#0a1d78','#38d6ff','Azul'], agua:['#19b8d0','#05506a','#b4fbff','Água'], folha:['#3fae22','#0c4a3a','#d6ff5a','Folha'],
    laranja:['#ff6f10','#a83300','#ffd76a','Laranja'], sol:['#ffbe0f','#c46a00','#fff3b0','Sol'], rosa:['#ff6f9e','#b8235a','#ffe6f0','Rosa'],
    lilas:['#b07ff0','#6a35b0','#86f0ff','Lilás'], violeta:['#6e5cff','#2a1aa8','#e8e2ff','Violeta'], magenta:['#c0157f','#3a0b66','#ff70b0','Magenta'],
    fogo:['#ff3a12','#8f0c45','#ffb020','Fogo'], gelo:['#d5e3ea','#7d97a6','#ffffff','Gelo'], onix:['#26272c','#050506','#a8a8a8','Ônix']
  };
  var EYES = { capsula:['Cápsula',0], bolinha:['Bolinha',1], feliz:['Feliz',2], sono:['Sonolento',3], brilho:['Brilhante',4],
    estrela:['Estrela',5], espiral:['Confuso',6], fechado:['Apertado',7], nenhum:['Sem olhos',-1] };
  /* corpos: perfil do torno (raio, altura), onde ficam os ombros e a cabeça */
  var BODIES = {
    jujuba:{ name:'Jujuba', pts:[[0,0],[0.38,0],[0.5,0.03],[0.555,0.12],[0.565,0.3],[0.555,0.5],[0.52,0.7],[0.45,0.86],[0.34,0.98],[0.18,1.06],[0,1.09]], armX:0.6, armY:0.88, headY:1.65 },
    gota:{ name:'Gota', pts:[[0,0],[0.42,0],[0.58,0.04],[0.64,0.16],[0.62,0.34],[0.53,0.56],[0.42,0.76],[0.31,0.92],[0.17,1.01],[0,1.04]], armX:0.5, armY:0.82, headY:1.6 },
    esguio:{ name:'Esguio', pts:[[0,0],[0.3,0],[0.42,0.03],[0.45,0.15],[0.455,0.42],[0.445,0.72],[0.41,0.96],[0.33,1.1],[0.18,1.17],[0,1.19]], armX:0.5, armY:0.98, headY:1.74 }
  };
  /* versões de ponta-cabeça: o perfil é espelhado na altura (largo em cima, fino embaixo) */
  function flip(pts){ var H = pts[pts.length - 1][1]; return pts.slice().reverse().map(function(p){ return [p[0], +(H - p[1]).toFixed(3)]; }); }
  BODIES.jujubaInv = { name:'Jujuba invertida', pts: flip(BODIES.jujuba.pts), armX:0.62, armY:0.86, headY:1.64 };
  BODIES.gotaInv = { name:'Gota invertida', pts: flip(BODIES.gota.pts), armX:0.7, armY:0.8, headY:1.6 };
  BODIES = { jujuba: BODIES.jujuba, jujubaInv: BODIES.jujubaInv, gota: BODIES.gota, gotaInv: BODIES.gotaInv, esguio: BODIES.esguio };
  var ARMS = { normal:'Normal', curto:'Curto', bolinha:'Bolinha' };
  /* acessórios: tall = quanto sobe acima da cabeça (o avatar pequeno afasta a câmera); float = flutua; body = vai no corpo */
  var ACC = {
    nenhum:{ name:'Nenhum' }, fone:{ name:'Fone' }, orelhas:{ name:'Orelhinhas', tall:0.2 }, antena:{ name:'Antenas', tall:0.38 },
    obra:{ name:'Capacete', tall:0.12 }, oculos:{ name:'Óculos escuros' }, flor:{ name:'Florzinha', tall:0.1 }, laco:{ name:'Laço', tall:0.22 },
    cone:{ name:'Cone', tall:0.65 }, bone:{ name:'Boné pra trás', tall:0.18 }, exclama:{ name:'Exclamação', tall:0.4, float:1 },
    pergunta:{ name:'Interrogação', tall:0.42, float:1 }, aureola:{ name:'Auréola', tall:0.36, float:1 }, natal:{ name:'Gorro de Natal', tall:0.25 },
    mago:{ name:'Chapéu de mago', tall:0.75 }, monoculo:{ name:'Monóculo' },
    gravata:{ name:'Gravata', body:1 }, borboleta:{ name:'Gravata borboleta', body:1 }
  };
  var FIXED = { branco:['#f7fbff','#7f98ab','#ffffff'], preto:['#14171f','#000000','#0a0c12'], amarelo:['#ffcf2a','#c46a00','#fff3b0'], rosa:['#ff9cbc','#c0406e','#fff0f5'] };
  var SHAPES = { quadrado:'Quadrado', circulo:'Círculo', d:'Meia-lua', triangulo:'Triângulo', feijao:'Feijão', pedra:'Pedra' };

  function load(){
    var c = { shape:'quadrado', color:'azul', eyes:'capsula', body:'jujuba', arms:'normal', blink:true, acc:'nenhum', accColor:'sol' };
    try {
      var v = localStorage.getItem('orvalho-avatar-shape'); if (SHAPES[v]) c.shape = v;
      v = localStorage.getItem('orvalho-avatar-cor'); if (PRESETS[v]) c.color = v;
      v = localStorage.getItem('orvalho-avatar-olhos'); if (v === '0') c.eyes = 'nenhum'; else if (EYES[v]) c.eyes = v;
      v = localStorage.getItem('orvalho-avatar-corpo'); if (BODIES[v]) c.body = v;
      v = localStorage.getItem('orvalho-avatar-bracos'); if (ARMS[v]) c.arms = v;
      if (localStorage.getItem('orvalho-avatar-piscar') === '0') c.blink = false;
      v = localStorage.getItem('orvalho-avatar-acessorio'); if (ACC[v]) c.acc = v;
      v = localStorage.getItem('orvalho-avatar-acessorio-cor'); if (PRESETS[v]) c.accColor = v;
    } catch (e) {}
    return c;
  }
  function store(c){
    try {
      localStorage.setItem('orvalho-avatar-shape', c.shape); localStorage.setItem('orvalho-avatar-cor', c.color);
      localStorage.setItem('orvalho-avatar-olhos', c.eyes); localStorage.setItem('orvalho-avatar-corpo', c.body);
      localStorage.setItem('orvalho-avatar-bracos', c.arms); localStorage.setItem('orvalho-avatar-piscar', c.blink ? '1' : '0'); localStorage.setItem('orvalho-avatar-acessorio', c.acc); localStorage.setItem('orvalho-avatar-acessorio-cor', c.accColor);
    } catch (e) {}
  }
  function copy(c){ return { shape:c.shape, color:c.color, eyes:c.eyes, body:c.body, arms:c.arms, blink:c.blink !== false, acc:c.acc, accColor:c.accColor }; }
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- fábrica do boneco ---------- */
  function Doll(canvas, o){
    if (!window.THREE) return null;
    var renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'low-power' }); }
    catch (e) { return null; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setClearColor(0x000000, 0);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(25, 1, 0.1, 50);
    camera.position.fromArray(o.cam); camera.lookAt(o.target[0], o.target[1], o.target[2]);

    /* estúdio para os reflexos: cúpula cinza + softboxes redondas */
    (function(){
      var env = new THREE.Scene();
      var g = new THREE.SphereGeometry(10, 48, 24), pos = g.attributes.position, cols = [];
      var top = new THREE.Color(0.85, 0.87, 0.9), mid = new THREE.Color(0.3, 0.32, 0.35), bot = new THREE.Color(0.06, 0.07, 0.08);
      for (var i = 0; i < pos.count; i++) {
        var y = pos.getY(i) / 10, c = y > 0 ? mid.clone().lerp(top, Math.pow(y, 0.8)) : mid.clone().lerp(bot, Math.pow(-y, 0.7));
        cols.push(c.r, c.g, c.b);
      }
      g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      env.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
      function panel(w, h, x, y, z, k){
        var p = new THREE.Mesh(new THREE.CircleGeometry(0.5, 48), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
        p.scale.set(w, h, 1); p.position.set(x, y, z); p.lookAt(0, 0, 0); env.add(p);
      }
      panel(5, 3.4, -4, 5, 5, 5); panel(1.3, 1.3, 4.7, 5.6, -3.2, 12); panel(7, 4, 0, 9, 0.5, 1.8);
      panel(1.4, 6, 6.5, 0.5, 2.5, 2.2); panel(6, 1.4, 0, 4.5, -6.5, 3);
      var pm = new THREE.PMREMGenerator(renderer);
      scene.environment = pm.fromScene(env, 0.02).texture;
      pm.dispose();
    })();
    var key = new THREE.DirectionalLight(0xffffff, 0.5); key.position.set(-2, 3.5, 4); scene.add(key);

    /* material vidro-gelatina: borda escurecida, luz interna embaixo, arco de brilho e olhos desenhados no shader */
    var mats = [], outlines = [];
    function jelly(p){
      var m = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.18, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03 });
      var u = {
        uRim: { value: new THREE.Color() }, uGlow: { value: new THREE.Color() }, uEye: { value: new THREE.Color() },
        uTop: { value: p.top }, uBot: { value: p.bot }, uArc: { value: p.arc || 0 },
        uEyes: { value: p.eyes ? 1 : 0 }, uEyeType: { value: 0 }, uBlink: { value: 1 }, uTime: { value: 0 }, uLook: { value: new THREE.Vector2() }
      };
      m.userData.u = u; m.userData.hasEyes = !!p.eyes;
      m.extensions = { derivatives: true };
      m.onBeforeCompile = function(sh){
        for (var k in u) sh.uniforms[k] = u[k];
        sh.vertexShader = 'varying vec3 vObjPos;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n\tvObjPos = position;');
        sh.fragmentShader = [
          'varying vec3 vObjPos;', 'uniform vec3 uRim;', 'uniform vec3 uGlow;', 'uniform vec3 uEye;',
          'uniform float uTop;', 'uniform float uBot;', 'uniform float uArc;', 'uniform float uEyes;', 'uniform float uEyeType;',
          'uniform float uBlink;', 'uniform float uTime;', 'uniform vec2 uLook;',
          'float sdCapsY(vec2 p, float h, float r){ p.y -= clamp(p.y, -h, h); return length(p) - r; }',
          'float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h); }',
          'float sdStar5(vec2 p, float r, float rf){',
          '  const vec2 k1 = vec2(0.809016994375, -0.587785252292); const vec2 k2 = vec2(-k1.x, k1.y);',
          '  p.x = abs(p.x); p -= 2.0 * max(dot(k1, p), 0.0) * k1; p -= 2.0 * max(dot(k2, p), 0.0) * k2;',
          '  p.x = abs(p.x); p.y -= r;',
          '  vec2 ba = rf * vec2(-k1.y, k1.x) - vec2(0.0, 1.0); float h = clamp(dot(p, ba) / dot(ba, ba), 0.0, r);',
          '  return length(p - ba * h) * sign(p.y * ba.x - p.x * ba.y);',
          '}',
          'float fill(float d){ float a = fwidth(d) + 0.002; return 1.0 - smoothstep(-a, a, d); }', ''
        ].join('\n') + sh.fragmentShader.replace('#include <tonemapping_fragment>', [
          'vec3 nV = normalize(normal);',
          'float ndv = clamp(dot(nV, normalize(vViewPosition)), 0.0, 1.0);',
          'float low = clamp((uTop - vObjPos.y) / (uTop - uBot), 0.0, 1.0); low = low * low * (3.0 - 2.0 * low);',
          'vec3 col = gl_FragColor.rgb;',
          'col += uGlow * low * pow(ndv, 1.8) * 0.7;',
          'col = mix(col, uRim, smoothstep(0.3, 0.95, 1.0 - ndv) * 0.8);',
          'float rr = length(nV.xy);',
          'float arc = exp(-pow((rr - 0.85) / 0.035, 2.0)) * smoothstep(-0.52, -0.72, nV.y);',
          'col += vec3(1.0) * arc * uArc * 1.8;',
          'if (uEyes > 0.5) {',
          '  vec3 op = normalize(vObjPos);',
          '  if (op.z > 0.0) {',
          '    vec2 q0 = op.xy - uLook * vec2(0.11, 0.09);',
          '    vec2 q = vec2(abs(q0.x), q0.y);',
          '    float bl = max(uBlink, 0.06);',
          '    float eye = 0.0, wh = 0.0;',
          '    if (uEyeType < 0.5) {',           // cápsula
          '      vec2 e = q - vec2(0.33, -0.06); e.y /= bl;',
          '      eye = fill(sdCapsY(e, 0.21, 0.2));',
          '      wh = fill((length((e - vec2(0.0, 0.18)) / vec2(0.125, 0.17)) - 1.0) * 0.12) * eye;',
          '    } else if (uEyeType < 1.5) {',    // bolinha
          '      vec2 e = q - vec2(0.28, -0.03); e.y /= bl;',
          '      eye = fill(length(e) - 0.185);',
          '      wh = fill(length(e - vec2(0.0, 0.075)) - 0.06) * eye;',
          '    } else if (uEyeType < 2.5) {',    // feliz ^ ^
          '      vec2 e = q - vec2(0.3, -0.15);',
          '      float d = abs(length(e) - 0.18) - 0.06;',
          '      d = max(d, -e.y - 0.01);',
          '      d = min(d, length(vec2(abs(e.x) - 0.18, e.y + 0.01)) - 0.06);',
          '      eye = fill(d);',
          '    } else if (uEyeType < 3.5) {',    // sonolento: meia-lua com pálpebra reta
          '      vec2 e = q - vec2(0.3, -0.02); e.y /= bl;',
          '      float d = length(e / vec2(1.0, 0.8)) - 0.24;',
          '      eye = fill(max(d, e.y + 0.01));',
          '    } else if (uEyeType < 4.5) {',    // brilhante: oval grande com dois brilhos
          '      vec2 e = q - vec2(0.3, -0.04); e.y /= bl;',
          '      eye = fill((length(e / vec2(0.18, 0.25)) - 1.0) * 0.18);',
          '      wh = max(fill(length(e - vec2(-0.05, 0.1)) - 0.065), fill(length(e - vec2(0.06, -0.1)) - 0.035)) * eye;',
          '    } else if (uEyeType < 5.5) {',    // estrela
          '      vec2 e = q - vec2(0.3, -0.04); e.y /= bl;',
          '      eye = fill(sdStar5(e, 0.27, 0.5) - 0.02);',
          '      wh = fill(length(e - vec2(-0.035, 0.06)) - 0.04) * eye;',
          '    } else if (uEyeType < 6.5) {',    // espiral girando (confuso)
          '      vec2 e = q - vec2(0.3, -0.04); e.y /= bl;',
          '      float r = length(e), s = 0.058;',
          '      float a = atan(e.y, e.x) + uTime * 3.0;',
          '      float dr = abs(fract((r - s * (a / 6.2832)) / s + 0.5) - 0.5) * s;',
          '      eye = fill(max(dr - 0.014, r - 0.2));',
          '    } else {',                        // fechadinho > <
          '      vec2 e = q - vec2(0.3, -0.04);',
          '      float d = min(sdSeg(e, vec2(0.1, 0.12), vec2(-0.09, 0.0)), sdSeg(e, vec2(-0.09, 0.0), vec2(0.1, -0.12))) - 0.045;',
          '      eye = fill(d);',
          '    }',
          '    col = mix(col, col * 0.15 + uEye, eye * 0.95);',
          '    col = mix(col, vec3(0.92, 0.95, 1.0), wh);',
          '  }',
          '}',
          'gl_FragColor.rgb = col;',
          '#include <tonemapping_fragment>'
        ].join('\n'));
      };
      mats.push(m);
      return m;
    }
    /* contorno escuro: casca invertida, empurrada ao longo da normal */
    function outline(mesh, thick){
      var om = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });
      om.onBeforeCompile = function(sh){
        sh.uniforms.uOut = { value: thick };
        sh.vertexShader = 'uniform float uOut;\n' + sh.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normal * uOut;');
      };
      mesh.add(new THREE.Mesh(mesh.geometry, om));
      outlines.push(om);
    }
    function lathe(points, seg){
      var v = points.map(function(p){ return new THREE.Vector2(p[0], p[1]); });
      return new THREE.LatheGeometry(new THREE.SplineCurve(v).getPoints(64), seg);
    }

    var fig = new THREE.Group(); scene.add(fig);
    var torso = new THREE.Mesh(lathe(BODIES.jujuba.pts, 72), jelly({ top: 0.7, bot: 0.05 }));
    torso.scale.z = 0.85; fig.add(torso); outline(torso, 0.035);
    var head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 64, 48), jelly({ top: 0.12, bot: -0.48, arc: 1, eyes: true }));
    fig.add(head); outline(head, 0.035);
    var ARM_PTS = [[0,-0.86],[0.11,-0.845],[0.175,-0.8],[0.2,-0.72],[0.198,-0.56],[0.182,-0.4],[0.162,-0.24],[0.14,-0.12],[0.11,-0.045],[0.065,-0.01],[0,0]];
    function armGeoFor(kind){
      if (kind === 'curto') return lathe(ARM_PTS.map(function(p){ return [p[0] * 1.08, p[1] * 0.5]; }), 48);
      if (kind === 'bolinha') { var g = new THREE.SphereGeometry(0.165, 40, 28); g.translate(0, -0.3, 0); return g; }
      return lathe(ARM_PTS, 48);
    }
    /* braços curto e bolinha flutuam soltos, afastados do corpo; o curto inclina para dentro */
    var ARM_POSE = { normal: { rest: 0.36, dx: 0, dy: 0 }, curto: { rest: -0.14, dx: 0.17, dy: -0.12 }, bolinha: { rest: 0, dx: 0.2, dy: -0.05 } };
    var REST = 0.36, AP = ARM_POSE.normal, armMeshes = [], armKind = 'normal', armGeo0 = armGeoFor('normal');
    function arm(side){
      var pivot = new THREE.Group();
      var a = new THREE.Mesh(armGeo0, jelly({ top: -0.3, bot: -0.86 }));
      a.scale.z = 0.88; pivot.add(a); outline(a, 0.035); fig.add(pivot); armMeshes.push(a);
      return pivot;
    }
    function setArms(kind){
      if (kind === armKind) return false;
      armKind = kind; AP = ARM_POSE[kind]; REST = AP.rest;
      var g = armGeoFor(kind), old = armMeshes[0].geometry;
      armMeshes.forEach(function(a){
        a.geometry = g; a.children[0].geometry = g;
        var u = a.material.userData.u; u.uTop.value = kind === 'normal' ? -0.3 : kind === 'curto' ? -0.15 : -0.25; u.uBot.value = kind === 'normal' ? -0.86 : kind === 'curto' ? -0.43 : -0.47;
      });
      old.dispose(); return true;
    }
    var armL = arm(-1), armR = arm(1);
    /* sombra no chão (só no palco do provador, onde o boneco aparece inteiro) */
    if (o.floor) {
      var sc = document.createElement('canvas'); sc.width = sc.height = 128;
      var sx = sc.getContext('2d'), gr = sx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gr.addColorStop(0, 'rgba(20,30,45,.45)'); gr.addColorStop(1, 'rgba(20,30,45,0)');
      sx.fillStyle = gr; sx.fillRect(0, 0, 128, 128);
      var shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
      shadow.rotation.x = -Math.PI / 2; shadow.position.y = -0.01; scene.add(shadow);
    }

    var B = BODIES.jujuba, bodyName = 'jujuba';
    function setBody(name){
      if (name === bodyName) return;
      bodyName = name; B = BODIES[name];
      var g = lathe(B.pts, 72), old = torso.geometry;
      torso.geometry = g; torso.children[0].geometry = g; old.dispose();
    }

    /* ---------- acessórios: um por vez, na cor escolhida; peças fixas (lente, pompom...) têm cor própria ---------- */
    var accGroup = null, accName = 'nenhum', accBody = '';
    var V3 = function(x, y, z){ return new THREE.Vector3(x, y, z); };
    function piece(geo, fixed, thick){
      geo.computeBoundingBox();
      var bb = geo.boundingBox, m = jelly({ top: bb.max.y - (bb.max.y - bb.min.y) * 0.35, bot: bb.min.y });
      m.userData.acc = fixed || true;
      var mesh = new THREE.Mesh(geo, m);
      outline(mesh, thick == null ? 0.022 : thick);
      mesh.children[0].material.userData.acc = fixed || true;
      return mesh;
    }
    function rAt(y){ // raio do torso na altura y
      var p = B.pts;
      for (var i = 1; i < p.length; i++) if (p[i][1] >= y) { var a = p[i - 1], b = p[i], k = (y - a[1]) / ((b[1] - a[1]) || 1); return a[0] + (b[0] - a[0]) * k; }
      return 0;
    }
    function bow(sc){
      var b = new THREE.Group();
      [-1, 1].forEach(function(s){
        var lobe = piece(lathe([[0,0],[0.06,0.02],[0.1,0.08],[0.115,0.14],[0.095,0.195],[0.05,0.222],[0,0.228]], 24));
        lobe.scale.set(1, 1, 0.55); lobe.rotation.z = -s * 1.3; lobe.position.x = s * 0.02; b.add(lobe);
      });
      var knot = piece(new THREE.SphereGeometry(0.062, 20, 14)); knot.scale.set(1, 1.1, 0.85); b.add(knot);
      b.scale.setScalar(sc); return b;
    }
    function along(mesh, a, b){ // cilindro do ponto a ao b
      var d = b.clone().sub(a); mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize()); return mesh;
    }
    var BUILD = {
      fone: function(g){
        g.add(piece(new THREE.TorusGeometry(0.555, 0.045, 16, 64, Math.PI)));
        [-1, 1].forEach(function(s){
          var cup = piece(lathe([[0,-0.1],[0.14,-0.095],[0.18,-0.06],[0.19,0],[0.18,0.06],[0.14,0.095],[0,0.1]], 40));
          cup.rotation.z = Math.PI / 2; cup.position.set(s * 0.54, -0.02, 0); g.add(cup);
        });
      },
      orelhas: function(g){
        [-1, 1].forEach(function(s){
          var e = new THREE.Group();

    }
    if (catNow === 'cores') {
      html += '<section class="acc-sec"><h3>Cor do acessório</h3><div class="color-grid" role="radiogroup" aria-label="Cor do acessório">';
      Object.keys(PRESETS).forEach(function(k){
        var p = PRESETS[k];
        html += '<button type="button" class="color-opt" role="radio" data-acc-color="' + k + '" aria-checked="' + (draft.accColor === k) + '" aria-label="' + p[3] + '" title="' + p[3] +
          '" style="--c1:' + p[0] + ';--c2:' + p[1] + ';--c3:' + p[2] + '"></button>';
      });
      html += '</div></section>';
    }
    pane.innerHTML = html;
  }
  function pick(v){
    var c = CAT[catNow]; if (!c) return;
    draft[c.key] = v;
    [].forEach.call(pane.querySelectorAll('[data-v]'), function(b){ b.setAttribute('aria-checked', b.getAttribute('data-v') === v ? 'true' : 'false'); });
    tint();
    if (big) big.set(draft);
  }
  pane.addEventListener('change', function(e){
    if (e.target.id === 'blink-toggle') { draft.blink = e.target.checked; if (big) big.set(draft); }
  });
  pane.addEventListener('click', function(e){
    var am = e.target.closest('[data-arms]');
    if (am) {
      draft.arms = am.getAttribute('data-arms');
      [].forEach.call(pane.querySelectorAll('[data-arms]'), function(o){ o.setAttribute('aria-checked', o === am ? 'true' : 'false'); });
      if (big) big.set(draft); return;
    }
    var ac = e.target.closest('[data-acc-color]');
    if (ac) {
      draft.accColor = ac.getAttribute('data-acc-color');
      [].forEach.call(pane.querySelectorAll('[data-acc-color]'), function(o){ o.setAttribute('aria-checked', o === ac ? 'true' : 'false'); });
      tint(); if (big) big.set(draft); return;
    }
    var b = e.target.closest('[data-v]'); if (!b) return;
    var sec = b.getAttribute('data-ui');
    if (sec) { // interface: só marca a escolha por enquanto
      uiDraft[sec] = b.getAttribute('data-v');
      [].forEach.call(pane.querySelectorAll('[data-ui="' + sec + '"]'), function(o){ o.setAttribute('aria-checked', o === b ? 'true' : 'false'); });
      return;
    }
    pick(b.getAttribute('data-v'));
  });
  var mode = 'prov', lastCat = { prov: 'olhos', ui: 'fundo' };
  var modeTabs = [].slice.call(back.querySelectorAll('.prov-tab [role="tab"]')), rails = [].slice.call(back.querySelectorAll('.prov-rail'));
  function selectCat(name, focus){
    catNow = name; lastCat[mode] = name;
    cats.forEach(function(c){ var on = c.getAttribute('data-cat') === name; c.setAttribute('aria-selected', on); c.tabIndex = on ? 0 : -1; if (on && focus) c.focus(); });
    drawPane(); pane.scrollTop = 0;
  }
  function selectMode(m, focus){
    mode = m;
    modeTabs.forEach(function(t){ var on = t.getAttribute('data-mode') === m; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; if (on && focus) t.focus(); });
    rails.forEach(function(r){ r.hidden = r.getAttribute('data-mode') !== m; });
    selectCat(lastCat[m]);
  }
  modeTabs.forEach(function(t, i){
    t.addEventListener('click', function(){ selectMode(t.getAttribute('data-mode')); });
    t.addEventListener('keydown', function(e){
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (d) { e.preventDefault(); selectMode(modeTabs[(i + d + modeTabs.length) % modeTabs.length].getAttribute('data-mode'), true); }
    });
  });
  rails.forEach(function(r){
    var list = [].slice.call(r.querySelectorAll('.cat'));
    list.forEach(function(c, i){
      c.addEventListener('click', function(){ selectCat(c.getAttribute('data-cat')); });
      c.addEventListener('keydown', function(e){
        var d = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ? -1 : 0;
        if (d) { e.preventDefault(); selectCat(list[(i + d + list.length) % list.length].getAttribute('data-cat'), true); }
      });
    });
  });

  var lastFocus = null;
  function open(){
    togglePop(false); draft = copy(saved); uiDraft = { fundo: ui.fundo, mouse: ui.mouse }; lastFocus = document.activeElement;
    back.hidden = false; btn.setAttribute('aria-expanded', 'true');
    tint(); selectMode(mode);
    if (!big) {
      big = Doll(pwin.querySelector('canvas'), { cam: [0, 1.4, 10.4], target: [0, 1.15, 0], floor: true, drag: pwin, reach: 420,
        onSpin: function(v){ var d = ((v * 180 / Math.PI + 180) % 360 + 360) % 360 - 180; spinInput.value = Math.round(d); } });
      if (!big) pwin.querySelector('.prov-hint').textContent = 'prévia 3D indisponível';
    }
    if (big) { big.set(draft, true); big.spinTo(0); spinInput.value = 0; big.start(); setTimeout(function(){ big.wave(1400); }, 350); }
    document.getElementById('prov-close').focus();
  }
  function close(save){
    if (save) {
      saved = copy(draft); store(saved);
      ui = { fundo: uiDraft.fundo, mouse: uiDraft.mouse };
      try { localStorage.setItem('orvalho-ui-fundo', ui.fundo); localStorage.setItem('orvalho-ui-mouse', ui.mouse); } catch (e) {}
      if (avatar) avatar.set(saved);
    }
    back.hidden = true; btn.setAttribute('aria-expanded', 'false');
    if (big) big.stop();
    (lastFocus || btn).focus();
  }
  btn.addEventListener('click', open);
  document.getElementById('prov-close').addEventListener('click', function(){ close(true); });
  document.getElementById('prov-cancel').addEventListener('click', function(){ close(false); });
  document.getElementById('prov-save').addEventListener('click', function(){ close(true); });
  document.getElementById('prov-wave').addEventListener('click', function(){ if (big) big.wave(1800); });
  document.getElementById('prov-reset').addEventListener('click', function(){ spinInput.value = 0; if (big) big.spinTo(0); });
  spinInput.addEventListener('input', function(){ if (big) big.spinTo(spinInput.value * Math.PI / 180); });
  document.getElementById('prov-rand').addEventListener('click', function(){
    function any(o){ var k = Object.keys(o); return k[Math.floor(Math.random() * k.length)]; }
    draft = { shape: draft.shape, blink: draft.blink, color: any(PRESETS), eyes: any(EYES), body: any(BODIES), arms: any(ARMS), acc: any(ACC), accColor: any(PRESETS) };
    if (draft.eyes === 'nenhum') draft.eyes = 'capsula';
    tint(); drawPane(); if (big) { big.set(draft); big.wave(1200); }
  });
  back.addEventListener('click', function(e){ if (e.target === back) close(true); });
  document.addEventListener('keydown', function(e){
    if (back.hidden) return;
    if (e.key === 'Escape') { close(true); return; }
    if (e.key === 'Tab') { // mantém o foco dentro do provador
      var f = [].filter.call(dialog.querySelectorAll('button,input,[tabindex="0"]'), function(el){ return el.offsetParent !== null && el.tabIndex >= 0; });
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
})();
</script>
